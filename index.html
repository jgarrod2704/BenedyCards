<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Álbum</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f1e7;--fg:#2b2620;--card:#fff;--line:#d9cfbb;--acc:#b8541c;--c0:#8a8a8a;--c1:#2f7bd0;--c2:#b0389c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--fg:#f0e9db;--card:#2a2621;--line:#4a4238;--acc:#e8873f}}
:root[data-theme="dark"]{--bg:#1c1a17;--fg:#f0e9db;--card:#2a2621;--line:#4a4238;--acc:#e8873f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coins{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.tabs button{flex:1}
.tabs button.on{outline:2px solid var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{aspect-ratio:2/3;border-radius:10px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;position:relative;overflow:hidden;color:var(--line)}
.slot.have,.face{border:3px solid var(--c0);background:var(--card);color:var(--fg)}
.r1{border-color:var(--c1)!important}.r2{border-color:var(--c2)!important;box-shadow:0 0 10px var(--c2)}
.emo{font-size:40px}.slot img,.face img{width:70%;border-radius:6px}
.qty{position:absolute;top:3px;right:6px;font-size:11px;font-weight:700}
.nav{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.msg{min-height:22px;margin:8px 0;font-weight:600}
.pack{display:flex;gap:8px;justify-content:center;margin:16px 0}
.flip{width:18%;aspect-ratio:2/3;perspective:600px;animation:deal .6s both}
.pack .face{font-size:10px}.pack .emo{font-size:28px}
@keyframes deal{from{opacity:0;transform:translateY(90px) scale(.4)}}
.stage{display:flex;justify-content:center}
.slot img.art,.face img.art{width:100%;height:100%;object-fit:cover;border-radius:6px}
.btn{display:inline-block;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px}
.pv{height:38px;border-radius:4px;vertical-align:middle;margin-left:6px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.cc{display:flex;flex-direction:column;gap:4px}
.th{aspect-ratio:2/3;border:3px solid var(--c0);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;overflow:hidden;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover}
.cc input[type=text],.cc select{width:100%;box-sizing:border-box;font:inherit;font-size:12px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.slot.hide{visibility:hidden}
.slot.pop{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.15);box-shadow:0 0 22px var(--acc)}}
.fly{position:fixed;z-index:50;margin:0;transform-origin:0 0;pointer-events:none;font-size:10px;box-shadow:0 10px 25px rgba(0,0,0,.4)}
.fly .emo{font-size:28px}
.foil{position:relative;width:170px;height:250px;margin:16px 0;transform-origin:50% 100%}
.fbody{position:absolute;inset:28px 0 0;background:linear-gradient(135deg,#e2b04a,#b8541c 45%,#7a2e0e);border-radius:0 0 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:4px;font-size:22px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.fbody::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 1.2s infinite}
@keyframes shine{to{left:130%}}
.top{position:absolute;top:0;left:0;right:0;height:32px;background:linear-gradient(135deg,#f0c15c,#b8541c);border-radius:10px 10px 0 0;transform-origin:0 100%;clip-path:polygon(0 0,100% 0,100% 80%,90% 100%,80% 80%,70% 100%,60% 80%,50% 100%,40% 80%,30% 100%,20% 80%,10% 100%,0 80%)}
.shake{animation:shake .9s}
@keyframes shake{0%,100%{transform:none}15%{transform:rotate(-5deg) translateX(-5px)}30%{transform:rotate(5deg) translateX(5px)}45%{transform:rotate(-6deg)}60%{transform:rotate(6deg)}80%{transform:rotate(-3deg) scale(1.05)}}
.foil.tear{animation:glow .6s forwards}
.tear .top{animation:tear .5s forwards}
@keyframes tear{to{transform:translate(110px,-90px) rotate(40deg);opacity:0}}
@keyframes glow{40%{filter:brightness(2) drop-shadow(0 0 30px #ffd86b)}100%{filter:brightness(1.6);opacity:0;transform:scale(1.2)}}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.back,.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px}
.back{background:var(--acc);color:#fff;font-size:34px}
.face{transform:rotateY(180deg)}
small{opacity:.7}
</style>
</head>
<body>
<main>
<header><h1>📖 Mi Álbum</h1><div class="coins">🪙 <span id="coins">0</span></div></header>
<div class="row">
  <button id="daily">🎁 Recompensa diaria</button>
  <button id="buy">📦 Abrir sobre (30🪙)</button>
</div>
<div class="msg" id="msg"></div>
<div class="row tabs"><button class="alt on" id="tAlbum">Álbum</button><button class="alt" id="tPack">Sobre</button></div>

<section id="album">
  <div class="nav"><button class="alt" id="prev">◀</button><strong id="pg"></strong><button class="alt" id="next">▶</button></div>
  <div class="grid" id="grid"></div>
  <p><small id="rules"></small></p>
</section>

<section id="packView" hidden>
  <div class="stage" id="stage"></div><div class="pack" id="pack"></div>
  
</section>
<p style="text-align:center"><button class="alt" id="test" hidden>🧪 +500🪙 (pruebas)</button> <button class="alt" id="reset">Reiniciar progreso</button></p>
</main>

<script src="cartas.js"></script>
<script>
/* Las cartas y ajustes están en cartas.js */
const A=AJUSTES,PACK_COST=A.precioSobre,PACK_SIZE=A.cartasPorSobre,DUP=A.bonusRepetida,PAGE_BONUS=A.bonusPagina,W=A.probabilidad;
const TEST_MODE=location.search.includes("prueba"); /* abre tu página con ?prueba al final para ver el botón de monedas de prueba */
const RAR={comun:0,rara:1,epica:2};
const CARDS=CARTAS.map((c,i)=>({e:"🃏",...c,r:RAR[c.rareza]??0,id:i}));

const $=id=>document.getElementById(id);
let S={coins:A.monedasIniciales,own:{},last:"",streak:0,done:[]},page=0,busy=false,landing=new Set();
try{const s=localStorage.getItem("album_v1");if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem("album_v1",JSON.stringify(S))}catch(e){}};
const say=t=>$("msg").textContent=t;
const today=()=>new Date().toISOString().slice(0,10);
const pages=()=>Math.ceil(CARDS.length/9);

const backHTML=()=>A.reverso?`<div class="back" style="background:url('${A.reverso}') center/cover"></div>`:'<div class="back">?</div>';
const foilHTML=()=>A.sobre
 ?`<div class="foil"><div class="top" style="background:url('${A.sobre}') 0 0/170px 250px"></div><div class="fbody" style="background:url('${A.sobre}') 0 -28px/170px 250px"></div></div>`
 :`<div class="foil"><div class="top"></div><div class="fbody"><span>✨</span><b>SOBRE</b><small>${PACK_SIZE} cartas</small></div></div>`;
function cardHTML(c){return c.img?`<img class="art" src="${c.img}" alt="">`:`<div class="emo">${c.e}</div><b>${c.n}</b>`}

function render(){
  $("coins").textContent=S.coins;
  $("pg").textContent=`Página ${page+1}/${pages()} · ${cnt(page)}/9`;
  $("grid").innerHTML=CARDS.slice(page*9,page*9+9).map(c=>{
    const q=S.own[c.id]||0;
    return q?`<div class="slot have r${c.r}${landing.has(c.id)?" hide":""}" data-id="${c.id}">${cardHTML(c)}${q>1?`<span class="qty">x${q}</span>`:""}</div>`
            :`<div class="slot">#${c.id+1}<br>?</div>`}).join("")+'<div class="slot">🔒</div>'.repeat(Math.max(0,9-CARDS.slice(page*9,page*9+9).length));
  $("prev").disabled=page==0||busy;$("next").disabled=page==pages()-1||busy;
  $("buy").disabled=S.coins<PACK_COST||busy;
  $("daily").disabled=S.last==today();
  save();
}
function cnt(p){return CARDS.slice(p*9,p*9+9).filter(c=>S.own[c.id]).length}

function draw(){
  const t=(()=>{let x=Math.random()*100;return x<W[0]?0:x<W[0]+W[1]?1:2})();
  let pool=CARDS.filter(c=>c.r==t);if(!pool.length)pool=CARDS;
  return pool[Math.floor(Math.random()*pool.length)];
}
function addCard(c){
  let extra="";
  if(S.own[c.id]){S.coins+=DUP;extra=` (repetida +${DUP}🪙)`}
  S.own[c.id]=(S.own[c.id]||0)+1;
  const p=Math.floor(c.id/9);
  if(cnt(p)==9&&!S.done.includes(p)){S.done.push(p);S.coins+=PAGE_BONUS;extra+=` 🎉 ¡Página ${p+1} completa! +${PAGE_BONUS}🪙`}
  return extra;
}

$("daily").onclick=()=>{
  const t=today(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=S.last==y?S.streak+1:1;S.last=t;
  const g=Math.min(A.diaria.base+(S.streak-1)*A.diaria.extra,A.diaria.max);S.coins+=g;
  say(`+${g}🪙 · Racha: ${S.streak} día(s)`);render();
};
$("buy").onclick=()=>{
  if(busy||S.coins<PACK_COST)return;busy=true;S.coins-=PACK_COST;
  const cs=Array.from({length:PACK_SIZE},draw),notes=[];
  cs.forEach(c=>{const e=addCard(c);if(e)notes.push(c.n+e)});
  save();say("");$("coins").textContent=S.coins;$("buy").disabled=true;
  $("pack").innerHTML="";
  const st=$("stage");
  st.innerHTML=foilHTML();
  show("pack");
  const f=st.firstChild;f.classList.add("shake");
  setTimeout(()=>f.classList.add("tear"),900);
  setTimeout(()=>{
    st.innerHTML="";
    $("pack").innerHTML=cs.map((c,i)=>`<div class="flip" style="animation-delay:${i*70}ms"><div class="in">${backHTML()}<div class="face r${c.r}">${cardHTML(c)}</div></div></div>`).join("");
    setTimeout(()=>document.querySelectorAll(".flip").forEach(x=>x.classList.add("open")),800);
    setTimeout(()=>say(notes.join(" · ")),1500);
    setTimeout(()=>fly(cs,notes.join(" · ")),2800);
  },1500);
};
function fly(cs,msg){
  const fl=[...document.querySelectorAll(".flip")].map((el,i)=>{
    const r=el.getBoundingClientRect(),d=document.createElement("div");
    d.className="fly slot have r"+cs[i].r;d.innerHTML=cardHTML(cs[i]);
    Object.assign(d.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
    document.body.appendChild(d);return [d,r]});
  landing=new Set(cs.map(c=>c.id));
  page=Math.floor(cs[0].id/9);
  show("album");render();say("Añadiendo al álbum…");
  let left=cs.length;
  fl.forEach(([d,r],i)=>{
    const t=document.querySelector('.slot[data-id="'+cs[i].id+'"]'),tr=(t||$("pg")).getBoundingClientRect();
    const sx=t?tr.width/r.width:.1,sy=t?tr.height/r.height:.1;
    const tx=tr.left+tr.width/2-r.left-r.width*sx/2,ty=tr.top+tr.height/2-r.top-r.height*sy/2;
    d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${tx}px,${ty}px) scale(${sx},${sy})`,opacity:t?1:0}],
      {duration:800,delay:i*160,easing:"cubic-bezier(.5,0,.2,1)",fill:"both"}).onfinish=()=>{
      d.remove();
      if(t){t.classList.remove("hide");t.classList.add("pop");setTimeout(()=>t.classList.remove("pop"),600)}
      if(--left==0){busy=false;landing.clear();render();say(msg)}
    };
  });
}
function show(v){$("album").hidden=v!="album";$("packView").hidden=v!="pack";
  $("tAlbum").classList.toggle("on",v=="album");$("tPack").classList.toggle("on",v=="pack")}
$("tAlbum").onclick=()=>{if(!busy)show("album")};$("tPack").onclick=()=>{if(!busy)show("pack")};
$("prev").onclick=()=>{page--;render()};$("next").onclick=()=>{page++;render()};
$("reset").onclick=()=>{if(confirm("¿Borrar todo el progreso?")){S={coins:A.monedasIniciales,own:{},last:"",streak:0,done:[]};page=0;say("");render()}};
$("test").hidden=!TEST_MODE;
$("test").onclick=()=>{S.coins+=500;say("+500🪙 de prueba");render()};
document.title=A.titulo;document.querySelector("h1").textContent="📖 "+A.titulo;
$("buy").textContent=`📦 Abrir sobre (${PACK_COST}🪙)`;
$("rules").textContent=`Completa una página (9/9) y ganas ${PAGE_BONUS}🪙. Las repetidas te dan ${DUP}🪙.`;
render();
</script>
</body>
</html>
